name: Apply auth chunk test correction

on:
  push:
    branches:
      - fix/rebuild-public-auth-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rebuild-public-auth-bootstrap
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct chunk assertions around Next development source maps
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          next_path = Path('next.config.ts')
          next_source = next_path.read_text()
          webpack_block = """  // Replit's development proxy truncates very large eval-source-map chunks.\n  // Keep client chunks compact and valid by disabling inline webpack source maps.\n  webpack(config, { dev, isServer }) {\n    if (dev && !isServer) {\n      config.devtool = false;\n    }\n    return config;\n  },\n"""
          if webpack_block not in next_source:
              raise SystemExit('Expected webpack devtool block missing')
          next_path.write_text(next_source.replace(webpack_block, '', 1))

          smoke_path = Path('scripts/smoke-next-hmr.mjs')
          smoke = smoke_path.read_text()
          old = """    if (isAppChunk && (source.includes('eval-source-map') || source.includes('eval(__webpack_require__.ts('))) {\n      throw new Error(`${routeLabel}: ${sourcePath} still embeds eval source maps and can exceed Replit's response limit.`);\n    }\n\n    try {\n"""
          new = """    if (chunkUrl.pathname.endsWith('/app/layout.js')) {\n      const forbiddenRootModules = [\n        'app/context/sessionContext.tsx',\n        'components/ui/customnav.tsx',\n        'node_modules/@supabase/auth-js/',\n      ];\n      const leakedModule = forbiddenRootModules.find((moduleName) => source.includes(moduleName));\n      if (leakedModule) {\n        throw new Error(`${routeLabel}: app/layout.js still contains ${leakedModule} instead of lazy-loading the authenticated shell.`);\n      }\n    }\n\n    console.log(`[chunk] ${routeLabel} ${sourcePath} ${sourceBytes} bytes`);\n\n    try {\n"""
          if old not in smoke:
              raise SystemExit('Old eval-source-map smoke assertion missing')
          smoke_path.write_text(smoke.replace(old, new, 1))

          verify_path = Path('scripts/verify-auth-bootstrap.mjs')
          verify = verify_path.read_text()
          verify = verify.replace("\nconst nextConfigSource = fs.readFileSync('next.config.ts', 'utf8');", '', 1)
          old_config_check = """\n\nif (!nextConfigSource.includes('config.devtool = false')) {\n  throw new Error('Development webpack still emits oversized eval-source-map client chunks.');\n}\n"""
          if old_config_check not in verify:
              raise SystemExit('Old next config regression assertion missing')
          verify = verify.replace(old_config_check, '', 1)
          old_smoke_check = """if (!smokeSource.includes('REPLIT_TRUNCATION_BYTES = 960 * 1024') || !smokeSource.includes('MAX_SAFE_APP_CHUNK_BYTES') || !smokeSource.includes("source.includes('eval-source-map')")) {\n  throw new Error('CI does not guard against Replit truncation or oversized eval app chunks.');\n}\n"""
          new_smoke_check = """if (!smokeSource.includes('REPLIT_TRUNCATION_BYTES = 960 * 1024') || !smokeSource.includes('MAX_SAFE_APP_CHUNK_BYTES') || !smokeSource.includes("'app/context/sessionContext.tsx'") || !smokeSource.includes("'node_modules/@supabase/auth-js/'")) {\n  throw new Error('CI does not guard against Replit truncation or authenticated modules leaking into app/layout.js.');\n}\n"""
          if old_smoke_check not in verify:
              raise SystemExit('Old smoke regression assertion missing')
          verify_path.write_text(verify.replace(old_smoke_check, new_smoke_check, 1))
          PY

      - name: Commit corrected assertions
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add next.config.ts scripts/smoke-next-hmr.mjs scripts/verify-auth-bootstrap.mjs
          git commit -m "Test root chunk isolation instead of webpack internals"
          git push origin HEAD:fix/rebuild-public-auth-bootstrap
