name: Remediate Runtime Dependencies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remediate-runtime-dependencies.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VOFMUN feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove unused runtime tooling and apply safe audit fixes
        run: |
          npm uninstall vite --save
          npm audit fix || true
          git diff --check

      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
            exit 0
          fi
          git commit -m "Remediate vulnerable runtime dependencies"
          git push origin HEAD:codex/port-mun-webapp-features
