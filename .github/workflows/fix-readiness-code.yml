name: Fix VOFMUN Readiness Code

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-readiness-code.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply targeted readiness fixes
        run: |
          python scripts/fix-readiness-code.py
          git diff --check

      - name: Commit fixes for permanent CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/messages app/speechrepo app/resolutions
          git rm scripts/fix-readiness-code.py
          git commit -m "Align messaging and document workflows with current schema"
          git push origin HEAD:codex/port-mun-webapp-features
