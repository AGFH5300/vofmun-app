name: VOFMUN Readiness CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: readiness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Smoke-test Next and chat WebSockets
        run: node scripts/smoke-next-hmr.mjs

      - name: Verify auth bootstrap regressions
        run: node scripts/verify-auth-bootstrap.mjs

      - name: Reject generic branding and temporary artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(?<!VOF)MUN (?:ONE|WEBAPP|Portal)|(?<!vof)mun(?:\.messages|:messages|-conversation-menu-opened|-message-menu-opened)'
          if grep -RInP "$forbidden" app components lib server --exclude-dir=node_modules 2>/dev/null; then
            echo "Generic branding or storage namespaces leaked into VOFMUN."
            exit 1
          fi
          test ! -e readiness-report.json
          test ! -e debug-report.json
          test ! -e .tmp
          test ! -e tmp
          test ! -e temp
          test ! -e downloads
          test ! -e output
          test ! -e evidence
          test ! -e artifacts
          test ! -e .codex
          test ! -e .windsurf
          test ! -e .antigravity
          test ! -e .claude
          test ! -e .cline
          test ! -e .roo
          test ! -e .continue
          test ! -e .copilot
          test ! -e .amazonq
          test ! -e .gemini
          test ! -e .qodo
          test ! -e .sweep
          test ! -e .devin
          test ! -e .aider
          test ! -e .sourcegraph
          test ! -e .factory
          test ! -e .tabnine
          test ! -e .augment
          test ! -e .codeium
          test ! -e .zed
          test ! -e .vscode
          test ! -e .idea
          test ! -e CLAUDE.local.md
          test ! -e AGENTS.local.md

      - name: Parse database migrations
        run: node scripts/check-migrations.mjs

      - name: Audit runtime dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Enforce release gates
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          echo "Runtime audit: $AUDIT_OUTCOME"
          echo "Type-check: $TYPECHECK_OUTCOME"
          echo "Lint: $LINT_OUTCOME"
          echo "Production build: $BUILD_OUTCOME"
          if [[ "$AUDIT_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" || "$LINT_OUTCOME" != "success" || "$BUILD_OUTCOME" != "success" ]]; then
            exit 1
          fi
