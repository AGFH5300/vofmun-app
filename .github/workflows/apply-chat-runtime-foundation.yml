name: Apply chat runtime foundation

on:
  push:
    branches:
      - fix/chat-receipts-attachments-and-composer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-receipts-attachments-and-composer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply runtime foundation
        run: python scripts/apply-chat-runtime-foundation.py

      - name: Commit runtime foundation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/chat/server.ts app/messages/context/ChatContext.tsx scripts/smoke-next-hmr.mjs scripts/verify-auth-bootstrap.mjs components/ui/site-footer.tsx supabase/migrations/20260806160000_fix_service_role_message_receipts.sql
          git commit -m "Repair chat attachments receipts and unread state"
          git push origin HEAD:fix/chat-receipts-attachments-and-composer
