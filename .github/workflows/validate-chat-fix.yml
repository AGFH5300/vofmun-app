name: Validate chat fix

on:
  push:
    branches:
      - fix/chat-receipts-attachments-and-composer

permissions:
  contents: read

concurrency:
  group: validate-chat-fix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Smoke-test Next and chat WebSockets
        run: node scripts/smoke-next-hmr.mjs

      - name: Verify regression checks
        run: node scripts/verify-auth-bootstrap.mjs

      - name: Parse database migrations
        run: node scripts/check-migrations.mjs

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
