name: Apply shell-quote lockfile fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-shell-quote-lock.yml

permissions:
  contents: write

jobs:
  apply-lockfile-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add secure shell-quote override
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.overrides = {
            ...(packageJson.overrides || {}),
            'shell-quote': '1.9.0'
          };
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Verify resolved package
        run: npm ls shell-quote

      - name: Verify production build when environment is available
        continue-on-error: true
        run: npm run build

      - name: Commit dependency fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-shell-quote-lock.yml
          git add package.json package-lock.json .github/workflows/fix-shell-quote-lock.yml
          git commit -m "fix: override vulnerable shell-quote dependency"
          git push origin HEAD:main
