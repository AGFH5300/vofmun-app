name: Fix Final VOFMUN Types

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'codex/port-mun-webapp-features'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply final type corrections
        run: |
          python scripts/fix-final-types.py
          git diff --check

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/resolutions/page.tsx app/speechrepo/page.tsx
          git rm scripts/fix-final-types.py
          git commit -m "Resolve final document workflow type errors"
          git push origin HEAD:codex/port-mun-webapp-features
