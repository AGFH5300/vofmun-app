name: Apply session handoff hotfix

on:
  push:
    branches:
      - hotfix/stabilize-login-session-handoff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/stabilize-login-session-handoff
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic auth handoff patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          session_path = Path('app/context/sessionContext.tsx')
          session = session_path.read_text()
          original_session = session

          session = session.replace(
              'import { usePathname, useRouter } from "next/navigation";',
              'import { useRouter } from "next/navigation";'
          )
          session = session.replace('  const pathname = usePathname();\n', '')
          session = session.replace('  const isResetPasswordRoute = pathname === "/reset-password";\n', '')
          session = session.replace(
              '''      if (isResetPasswordRoute) {\n        finish();\n        return;\n      }\n\n''',
              ''
          )
          session = session.replace(
              '  }, [applyUser, completeHydration, isResetPasswordRoute, resolveProfile]);',
              '  }, [applyUser, completeHydration, resolveProfile]);'
          )

          persisted_helper = '''\nconst findPersistedSession = (value: unknown): Session | null => {\n  if (!value || typeof value !== "object") return null;\n\n  const record = value as Record<string, unknown>;\n  if (\n    typeof record.access_token === "string" &&\n    record.user &&\n    typeof record.user === "object" &&\n    typeof (record.user as Record<string, unknown>).id === "string"\n  ) {\n    return value as Session;\n  }\n\n  for (const nested of Object.values(record)) {\n    const resolved = findPersistedSession(nested);\n    if (resolved) return resolved;\n  }\n\n  return null;\n};\n\nconst readPersistedSession = (): Session | null => {\n  if (typeof window === "undefined") return null;\n\n  for (let index = 0; index < window.localStorage.length; index += 1) {\n    const key = window.localStorage.key(index);\n    if (!key || !key.startsWith("sb-") || !key.endsWith("-auth-token")) continue;\n\n    const rawValue = window.localStorage.getItem(key);\n    if (!rawValue) continue;\n\n    try {\n      const resolved = findPersistedSession(JSON.parse(rawValue));\n      if (resolved) return resolved;\n    } catch {\n      // Ignore malformed or unrelated storage entries.\n    }\n  }\n\n  return null;\n};\n'''
          anchor = '''const readCachedUser = (): UserType | null => {'''
          if 'const readPersistedSession = (): Session | null =>' not in session:
              session = session.replace(anchor, persisted_helper + '\n' + anchor)

          fallback = '''\n    // Replit development previews can occasionally suppress INITIAL_SESSION while\n    // the token refresh still succeeds. Read the Supabase-persisted session without\n    // calling back into the auth client so profile loading remains deterministic.\n    const persistedFallbackId = window.setTimeout(() => {\n      if (!active || receivedInitialAuthEvent) return;\n      const persistedSession = readPersistedSession();\n      if (!persistedSession) return;\n      receivedInitialAuthEvent = true;\n      void synchronizeAuthState("INITIAL_SESSION", persistedSession);\n    }, 1_500);\n'''
          watchdog_anchor = '''    // Never leave the application behind an infinite loader if the auth client or\n'''
          if 'const persistedFallbackId = window.setTimeout' not in session:
              session = session.replace(watchdog_anchor, fallback + '\n' + watchdog_anchor)
          session = session.replace(
              '      window.clearTimeout(watchdogId);\n',
              '      window.clearTimeout(persistedFallbackId);\n      window.clearTimeout(watchdogId);\n'
          )

          if session == original_session:
              raise SystemExit('Session provider patch made no changes')
          session_path.write_text(session)

          login_path = Path('app/login/page.tsx')
          login = login_path.read_text()
          original_login = login

          login = login.replace(
              'import { getCurrentAppUser } from "@/lib/auth/getCurrentAppUser";',
              'import { getAppUserForSession } from "@/lib/auth/getCurrentAppUser";'
          )
          login = login.replace('import Cookies from "js-cookie";\n', '')
          login = login.replace(
              '''      const { error: signInError } = await supabase.auth.signInWithPassword({\n''',
              '''      const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({\n'''
          )
          login = login.replace(
              '''      const { appUser } = await getCurrentAppUser();\n\n      if (!appUser) {\n''',
              '''      const session = signInData.session;\n      if (!session) {\n        setError("Unable to establish a secure login session.");\n        setLoading(false);\n        return;\n      }\n\n      const { appUser } = await getAppUserForSession(session);\n\n      if (!appUser) {\n'''
          )

          stale_redirect = '''\n  React.useEffect(() => {\n    const storedUser = Cookies.get("user");\n\n    if (!storedUser) {\n      return;\n    }\n\n    try {\n      const parsedUser = JSON.parse(storedUser);\n      if (parsedUser?.role) {\n        router.replace(routeByRole(parsedUser.role));\n      }\n    } catch {\n      Cookies.remove("user");\n    }\n  }, [router]);\n'''
          if stale_redirect not in login:
              raise SystemExit('Expected stale cookie redirect block was not found')
          login = login.replace(stale_redirect, '\n')

          if login == original_login:
              raise SystemExit('Login patch made no changes')
          login_path.write_text(login)
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/context/sessionContext.tsx app/login/page.tsx
          git commit -m "Stabilize login session handoff" || exit 0
          git push origin HEAD:hotfix/stabilize-login-session-handoff
