name: Sync and Verify VOFMUN Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-and-verify-vofmun-release.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify branding and repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(?<!VOF)MUN (?:ONE|WEBAPP|Portal)|(?<!vof)mun(?:\.messages|:messages|-conversation-menu-opened|-message-menu-opened)'
          if grep -RInP "$forbidden" app components lib server --exclude-dir=node_modules 2>/dev/null; then
            echo "Generic branding or storage namespaces leaked into VOFMUN."
            exit 1
          fi
          test ! -e readiness-report.json
          test ! -e identity-hardening-result.txt
          test ! -e scripts/apply-identity-hardening.py
          test ! -e scripts/finalize-identity-hardening.py
          test ! -e scripts/finish-attachment-hardening.py
          test ! -e scripts/harden-custom-chat-server.py

      - name: Parse database migrations
        run: |
          python -m pip install --disable-pip-version-check --quiet pglast
          python <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for migration in sorted(Path('supabase/migrations').glob('*.sql')):
              parse_sql(migration.read_text())
              print(f'Parsed {migration}')
          PY

      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > runtime-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('runtime-audit.json', 'utf8'));
          const totals = report.metadata?.vulnerabilities || {};
          console.log('Runtime audit:', totals);
          const blocking = Number(totals.high || 0) + Number(totals.critical || 0);
          if (blocking > 0) process.exit(1);
          NODE
          rm runtime-audit.json

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-anon-key
        run: npm run build

      - name: Push verified merge candidate
        run: |
          git status --short
          git push origin HEAD:codex/port-mun-webapp-features
