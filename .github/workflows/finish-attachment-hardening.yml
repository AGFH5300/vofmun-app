name: Finish VOFMUN Attachment Hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'codex/port-mun-webapp-features'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply attachment hardening
        run: |
          python scripts/finish-attachment-hardening.py
          git diff --check

      - name: Commit attachment hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/finish-attachment-hardening.py
          git add -A
          git commit -m "Route chat attachments through verified server APIs"
          git push origin HEAD:codex/port-mun-webapp-features
