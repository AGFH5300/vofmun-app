name: Harden VOFMUN Custom Chat Server

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'codex/port-mun-webapp-features'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply custom server hardening
        run: |
          python scripts/harden-custom-chat-server.py
          git diff --check

      - name: Commit custom server hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/harden-custom-chat-server.py
          git add -A
          git commit -m "Secure custom chat message and attachment handling"
          git push origin HEAD:codex/port-mun-webapp-features
