name: Upgrade VOFMUN to Next 16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/upgrade-next-16.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out VOFMUN feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install supported Next.js 16 toolchain
        run: |
          npm install next@16.3.0 react@latest react-dom@latest
          npm install --save-dev eslint-config-next@16.3.0 @types/react@latest @types/react-dom@latest
          npm pkg set scripts.lint="eslint ."
          git diff --check

      - name: Commit framework upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade VOFMUN to Next.js 16.3"
          git push origin HEAD:codex/port-mun-webapp-features
