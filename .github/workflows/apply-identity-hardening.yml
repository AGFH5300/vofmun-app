name: Apply VOFMUN Identity Hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-identity-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply identity and document fixes
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/apply-identity-hardening.py > /tmp/identity-hardening.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ $status -eq 0 ]]; then
            git diff --check >> /tmp/identity-hardening.log 2>&1
            status=$?
            echo "status=$status" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/identity-hardening.log
          exit 0

      - name: Commit fixes or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.apply.outputs.status }}" == "0" ]]; then
            rm -f identity-hardening-result.txt
            git add app components db lib supabase
            git rm scripts/apply-identity-hardening.py
            git commit -m "Link legacy identities and secure document creation"
          else
            git reset --hard HEAD
            cp /tmp/identity-hardening.log identity-hardening-result.txt
            git add identity-hardening-result.txt
            git commit -m "Capture identity hardening diagnostic"
          fi
          git push origin HEAD:codex/port-mun-webapp-features
