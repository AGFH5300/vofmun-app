name: Apply VOFMUN Identity Hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-identity-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply identity and document fixes
        run: |
          python scripts/apply-identity-hardening.py
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components db lib supabase
          git rm scripts/apply-identity-hardening.py
          git commit -m "Link legacy identities and secure document creation"
          git push origin HEAD:codex/port-mun-webapp-features
