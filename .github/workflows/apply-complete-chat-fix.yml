name: Apply complete chat fix

on:
  push:
    branches:
      - fix/chat-receipts-attachments-and-composer

concurrency:
  group: complete-chat-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-receipts-attachments-and-composer
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply complete chat fix
        run: |
          python scripts/fix-chat-ui-transformer.py
          python scripts/apply-chat-runtime-foundation.py
          python scripts/apply-chat-ui-completion.py

      - name: Commit complete chat fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/chat/server.ts \
            app/messages/context/ChatContext.tsx \
            app/messages/components/ConversationListItem.tsx \
            app/messages/components/ConversationList.tsx \
            app/messages/components/MessageBubble.tsx \
            app/messages/page.tsx \
            lib/chat/types.ts \
            scripts/smoke-next-hmr.mjs \
            scripts/verify-auth-bootstrap.mjs \
            components/ui/site-footer.tsx \
            supabase/migrations/20260806160000_fix_service_role_message_receipts.sql
          git commit -m "Finish chat attachments receipts editing and actions"
          git push origin HEAD:fix/chat-receipts-attachments-and-composer
