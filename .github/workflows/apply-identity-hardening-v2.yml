name: Apply VOFMUN Identity Hardening v2

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/port-mun-webapp-features'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/port-mun-webapp-features
          fetch-depth: 0

      - name: Apply identity and document fixes
        id: apply
        shell: bash
        run: |
          set +e
          sed -i 's/expected=3,/expected=2,/' scripts/apply-identity-hardening.py
          python scripts/apply-identity-hardening.py > /tmp/identity-hardening.log 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            git diff --check >> /tmp/identity-hardening.log 2>&1
            status=$?
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/identity-hardening.log
          exit 0

      - name: Commit fixes or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ steps.apply.outputs.status }}" == "0" ]]; then
            rm -f identity-hardening-result.txt scripts/apply-identity-hardening.py
            git add -A
            git commit -m "Link legacy identities and secure document creation"
          else
            git reset --hard HEAD
            cp /tmp/identity-hardening.log identity-hardening-result.txt
            git add identity-hardening-result.txt
            git commit -m "Refresh identity hardening diagnostic"
          fi
          git push origin HEAD:codex/port-mun-webapp-features
