name: Apply explicit WebSocket upgrade routing

on:
  push:
    branches:
      - hotfix/restore-client-hydration-and-hmr

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/restore-client-hydration-and-hmr
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Route chat and Next upgrades explicitly
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('server/chat/server.ts')
          source = path.read_text()
          old = '''const wss = new WebSocketServer({ server, path: CHAT_WS_PATH });

          wss.on('connection', (socket, req) => {'''
          new = '''const wss = new WebSocketServer({ noServer: true });
          const nextUpgradeHandler = nextApp.getUpgradeHandler();

          server.on('upgrade', (request, socket, head) => {
            const pathname = new URL(request.url || '/', 'http://localhost').pathname;

            if (pathname === CHAT_WS_PATH) {
              wss.handleUpgrade(request, socket, head, (webSocket) => {
                wss.emit('connection', webSocket, request);
              });
              return;
            }

            void nextUpgradeHandler(request, socket, head);
          });

          wss.on('connection', (socket, req) => {'''
          if old not in source:
              raise SystemExit('Expected WebSocket server block not found')
          path.write_text(source.replace(old, new))

          check_path = Path('scripts/verify-auth-bootstrap.mjs')
          check = check_path.read_text()
          check = check.replace(
              "if (!serverSource.includes('webpack: true') || !serverSource.includes('turbopack: false')) {",
              "if (!serverSource.includes('new WebSocketServer({ noServer: true })') || !serverSource.includes('nextApp.getUpgradeHandler()')) {\n  throw new Error('Chat and Next WebSocket upgrades are not explicitly separated.');\n}\n\nif (!serverSource.includes('webpack: true') || !serverSource.includes('turbopack: false')) {"
          )
          check_path.write_text(check)
          PY

      - name: Commit routing fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/chat/server.ts scripts/verify-auth-bootstrap.mjs
          git commit -m "Route Next and chat WebSocket upgrades explicitly" || exit 0
          git push origin HEAD:hotfix/restore-client-hydration-and-hmr
